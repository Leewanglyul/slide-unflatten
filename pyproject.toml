[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slide-unflatten"
version = "0.2.0"
description = "Turn image-only slides (NotebookLM, Gemini, Canva, Gamma, scans) into editable PPTX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-pptx>=1.0,<2",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "fonttools>=4.50",
    "pydantic>=2.6",
]

[project.optional-dependencies]
claude = ["anthropic>=0.60"]
ocr = ["easyocr>=1.7", "torch>=2.1"]
segment = ["ultralytics>=8.3"]
inpaint = ["simple-lama-inpainting>=0.1.2"]
ui = ["gradio>=4.40"]
all = ["slide-unflatten[claude,ocr,segment,inpaint,ui]"]
dev = ["pytest>=8"]

[project.scripts]
unflatten = "unflatten.cli:main"

[tool.setuptools.packages.find]
include = ["unflatten*"]
